name: 'GH OWASP dependency check'

on:
  pull_request:
  schedule:
    - cron: "17 23 * * 0-5"
  workflow_dispatch:  

jobs:
  build:
    name: 'OWASP dependency check'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: 'Set up JDK'
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'zulu'
          cache: 'maven'

      - name: 'Restore OWASP cache'
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-db-maven-${{ github.run_id }}
          restore-keys: |
            owasp-db-maven

      - name: 'Update OWASP Dependency Check Database'
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -U org.owasp:dependency-check-maven:update-only -DnvdApiKeyEnvironmentVariable=NVD_API_KEY

      - name: 'Save OWASP cache'
        uses: actions/cache/save@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-db-maven-${{ github.run_id }}

      - name: 'OWASP Dependency Check'
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -DnvdApiKey=${{ secrets.NVD_API_KEY }} -DskipTests -U package org.owasp:dependency-check-maven:check -fae -B -Dorg.slf4j.simpleLogger.defaultLogLevel=WARN -DfailBuildOnCVSS=7

      - name: 'Upload result to GitHub Code Scanning'
        uses: github/codeql-action/upload-sarif@v4.37.8
        with:
          sarif_file: target/dependency-check-report.sarif

      - name: 'Cleanup snapshots'
        run: mvn clean build-helper:remove-project-artifact
